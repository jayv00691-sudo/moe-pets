<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>萌宠角色图鉴</title>
<script src="config.js"></script>
<style>
  :root{
    --bg:#FFF8F0;
    --card:#FFFFFF;
    --ink:#4A3B32;
    --muted:#9A8878;
    --line:#F1E3D3;
    --brand:#FF9A76;
    --brand2:#FFC978;
    --shadow:0 10px 30px rgba(180,140,110,.14);
    --shadow-lg:0 24px 60px rgba(180,140,110,.22);
    --radius:24px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.6;
  }
  button{font-family:inherit;}

  /* ---------- Header ---------- */
  header.hero{
    text-align:center;
    padding:48px 20px 28px;
  }
  .hero h1{
    margin:0 0 8px;
    font-size:clamp(30px,5vw,46px);
    letter-spacing:2px;
    font-weight:800;
  }
  .hero p{margin:0;color:var(--muted);font-size:15px;}

  /* ---------- Toolbar ---------- */
  .toolbar{
    max-width:1240px;margin:0 auto;padding:0 20px 8px;
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;
  }
  .btn{
    border:1px solid var(--line);
    background:#fff;color:var(--ink);
    padding:9px 16px;border-radius:999px;
    font-size:14px;font-weight:600;cursor:pointer;
    transition:transform .15s ease, box-shadow .2s ease, background .2s ease;
    box-shadow:0 2px 6px rgba(180,140,110,.08);
  }
  .btn:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
  .btn:active{transform:translateY(0);}
  .btn.primary{
    background:linear-gradient(135deg,var(--brand),var(--brand2));
    color:#fff;border-color:transparent;
  }
  .btn.danger{color:#C0392B;border-color:#F5D5D0;}
  .search{
    padding:9px 16px;border-radius:999px;border:1px solid var(--line);
    background:#fff;font-size:14px;min-width:200px;color:var(--ink);outline:none;
  }
  .search:focus{border-color:var(--brand);}

  /* ---------- Grid ---------- */
  main{max-width:1240px;margin:0 auto;padding:12px 20px 60px;}
  .grid{
    display:grid;gap:24px;
    grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  }
  .card{
    position:relative;
    border-radius:var(--radius);
    padding:22px;
    box-shadow:var(--shadow);
    transition:transform .28s ease, box-shadow .28s ease;
    overflow:hidden;
  }
  .card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg);}
  .card .edit-hint{
    position:absolute;top:14px;right:14px;
    background:rgba(255,255,255,.9);
    border:none;border-radius:999px;
    padding:6px 12px;font-size:12px;font-weight:700;color:var(--muted);
    cursor:pointer;opacity:0;transition:opacity .2s ease;
  }
  .card:hover .edit-hint{opacity:1;}
  .card .edit-hint:hover{color:var(--brand);}

  .avatar{
    position:relative;
    width:112px;height:112px;border-radius:50%;
    background:rgba(255,255,255,.75);
    border:4px solid #fff;
    margin:0 auto 12px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(180,140,110,.18);
    font-size:52px;
  }
  .avatar svg{width:84px;height:84px;}
  .avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;}

  /* 头像右下角的上传角标 */
  .cam{
    position:absolute;right:-4px;bottom:-4px;
    width:32px;height:32px;border-radius:50%;
    border:2px solid #fff;background:#fff;padding:0;line-height:1;
    font-size:15px;cursor:pointer;
    box-shadow:0 3px 10px rgba(140,100,70,.28);
    opacity:0;transition:opacity .2s ease, transform .15s ease;
    display:flex;align-items:center;justify-content:center;
  }
  .card:hover .cam,.avatar:hover .cam,.avatar-sm:hover .cam{opacity:1;}
  .cam:hover{transform:scale(1.15);}
  .cam.clear{right:auto;left:-4px;width:24px;height:24px;font-size:10px;color:#C0392B;}

  .char-name{
    text-align:center;font-size:22px;font-weight:800;margin:0 0 2px;
  }
  .char-sub{
    text-align:center;color:var(--muted);font-size:13px;margin:0 0 3px;
  }
  .char-self{
    text-align:center;color:#BCA894;font-size:12px;margin:0 0 10px;
  }
  .char-self b{color:var(--muted);font-weight:700;}
  .meta-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .chip{
    background:rgba(255,255,255,.85);
    border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;
    color:#6B5B4D;
  }
  .tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:14px;}
  .tag{
    background:rgba(255,255,255,.9);
    border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;color:#7A6555;
  }

  .panel{
    background:rgba(255,255,255,.72);
    border-radius:18px;padding:14px 16px;font-size:13.5px;
  }
  .panel + .panel{margin-top:10px;}
  .row{display:flex;gap:8px;padding:4px 0;}
  .row .k{flex:0 0 66px;color:var(--muted);font-weight:700;}
  .row .v{flex:1;word-break:break-word;}
  .quote{color:#B4593C;font-weight:700;}
  .empty{color:#BDAE9F;font-style:italic;}
  .list{margin:0;padding-left:18px;}
  .list li{margin:2px 0;}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(60,42,32,.45);
    backdrop-filter:blur(3px);
    display:none;align-items:flex-start;justify-content:center;
    padding:40px 16px;overflow-y:auto;z-index:50;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--card);border-radius:22px;width:100%;max-width:660px;
    box-shadow:0 30px 80px rgba(80,50,30,.3);
    animation:pop .22s ease;
  }
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98);}to{opacity:1;transform:none;}}
  .modal-head{
    padding:20px 24px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .modal-head h2{margin:0;font-size:19px;}
  .head-left{display:flex;align-items:center;gap:12px;min-width:0;}
  .head-left h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .avatar-sm{
    position:relative;flex:0 0 60px;width:60px;height:60px;border-radius:50%;
    background:linear-gradient(135deg,#FFF3E6,#FFE0CC);
    display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden;
    cursor:pointer;
  }
  .avatar-sm svg{width:44px;height:44px;}
  .avatar-sm img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;}
  .avatar-sm .cam{width:24px;height:24px;font-size:11px;right:-2px;bottom:-2px;opacity:0;}
  .avatar-sm:hover .cam{opacity:1;}
  .modal-body{padding:20px 24px;max-height:none;}
  .modal-foot{
    padding:16px 24px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;gap:10px;
    position:sticky;bottom:0;background:#fff;border-radius:0 0 22px 22px;
  }

  .sec-title{
    font-size:12px;font-weight:800;color:var(--brand);
    letter-spacing:1px;margin:18px 0 10px;
    display:flex;align-items:center;gap:8px;
  }
  .sec-title::after{content:"";flex:1;height:1px;background:var(--line);}
  .sec-title:first-child{margin-top:0;}

  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px;}
  .field .tip{font-weight:400;color:#B9A899;}
  .field input[type=text],
  .field textarea,
  .field select{
    width:100%;padding:10px 12px;border:1px solid var(--line);
    border-radius:12px;font-size:14px;font-family:inherit;color:var(--ink);
    background:#FFFDFB;outline:none;transition:border-color .18s, box-shadow .18s;
  }
  .field input[type=text]:focus,
  .field textarea:focus,
  .field select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(255,154,118,.16);}
  .field textarea{resize:vertical;min-height:62px;line-height:1.6;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:560px){.grid2{grid-template-columns:1fr;}}

  .swatches{display:flex;flex-wrap:wrap;gap:8px;}
  .swatch{
    width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer;
    transition:transform .15s;
  }
  .swatch:hover{transform:scale(1.1);}
  .swatch.sel{border-color:#fff;box-shadow:0 0 0 2px var(--brand);}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);
    background:#4A3B32;color:#fff;padding:11px 22px;border-radius:999px;
    font-size:14px;font-weight:600;opacity:0;pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;z-index:99;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  footer{text-align:center;color:#C4B4A4;font-size:13px;padding:8px 0 40px;}
  .kbd{background:rgba(0,0,0,.06);border-radius:5px;padding:1px 5px;font-size:12px;}

  /* ---------- 图像库 ---------- */
  .thumbs{display:flex;gap:6px;justify-content:center;margin:0 0 12px;flex-wrap:wrap;}
  .thumb{
    width:46px;height:46px;border-radius:12px;object-fit:cover;cursor:pointer;
    border:2px solid #fff;box-shadow:0 2px 6px rgba(180,140,110,.2);
    transition:transform .18s ease;background:#fff;
  }
  .thumb:hover{transform:scale(1.12);}
  .thumb.more{
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:800;color:var(--muted);background:rgba(255,255,255,.75);
  }

  .gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;}
  .g-item{position:relative;}
  .g-item img{
    width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;cursor:zoom-in;
    border:1px solid var(--line);background:#fff;display:block;
  }
  .g-del{
    position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;
    border:none;background:#fff;color:#C0392B;font-size:11px;font-weight:800;cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.18);line-height:1;padding:0;
  }
  .repo-badge{
    position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.45);color:#fff;
    font-size:9px;padding:1px 5px;border-radius:6px;font-weight:700;letter-spacing:.5px;
  }
  .g-add{display:flex;gap:8px;margin-top:12px;}
  .g-add input{
    flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:12px;
    font-size:14px;font-family:inherit;color:var(--ink);background:#FFFDFB;outline:none;
  }
  .g-add input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(255,154,118,.16);}
  .g-hint{font-size:12px;color:#B9A899;margin:10px 0 0;line-height:1.7;}
  .g-hint code{background:#F6EEE6;padding:1px 5px;border-radius:5px;}

  .lightbox{
    position:fixed;inset:0;background:rgba(30,20,15,.9);z-index:100;
    display:none;align-items:center;justify-content:center;padding:40px;cursor:zoom-out;
  }
  .lightbox.open{display:flex;}
  .lightbox img{
    max-width:100%;max-height:100%;border-radius:14px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);cursor:default;
  }
  .lightbox .lb-close{
    position:absolute;top:16px;right:24px;color:#fff;font-size:30px;
    cursor:pointer;opacity:.75;line-height:1;
  }
  .lightbox .lb-close:hover{opacity:1;}
  .lb-actions{
    position:absolute;bottom:26px;left:50%;transform:translateX(-50%);
    display:flex;gap:10px;
  }
  .lb-btn{
    background:rgba(255,255,255,.94);border:none;border-radius:999px;
    padding:9px 20px;font-size:14px;font-weight:700;color:var(--ink);
    cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.28);font-family:inherit;
    transition:transform .15s ease;
  }
  .lb-btn:hover{background:#fff;transform:translateY(-2px);}
  .avatar-now{
    position:absolute;left:4px;top:4px;background:var(--brand);color:#fff;
    font-size:9px;padding:2px 6px;border-radius:6px;font-weight:800;letter-spacing:.5px;
  }

  /* ---------- 只读模式（默认） ---------- */
  body.ro [data-edit-only]{display:none !important;}
  body.ro #overlay .modal-body input[type=text],
  body.ro #overlay .modal-body textarea{
    background:transparent;border-color:transparent;box-shadow:none;
    padding-left:0;padding-right:0;cursor:default;color:var(--ink);
  }
  body.ro #overlay .modal-body textarea{resize:none;}
  body.ro .swatch{cursor:default;}
  body.ro .swatch:hover{transform:none;}
  .lock-tip{
    display:inline-flex;align-items:center;gap:5px;
    background:rgba(255,255,255,.7);border-radius:999px;
    padding:3px 10px;font-size:11px;font-weight:700;color:var(--muted);
  }
  .gate-box{text-align:center;padding:8px 4px 2px;}
  .gate-box p{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.7;}
  .gate-box input{
    width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;
    font-size:15px;font-family:inherit;color:var(--ink);background:#FFFDFB;outline:none;
    text-align:center;letter-spacing:1px;
  }
  .gate-box input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(255,154,118,.16);}
  .gate-err{color:#C0392B;font-size:12.5px;font-weight:700;margin:10px 0 0;min-height:18px;}
</style>
</head>
<body class="ro">

<header class="hero">
  <h1>🌟 萌宠角色图鉴 🌟</h1>
  <p id="heroSub">点开任意一只 → 查看完整资料</p>
</header>

<div class="toolbar">
  <input id="search" class="search" type="text" placeholder="🔍 搜索名字 / 物种 / 性格…">
  <button class="btn primary" id="btnGate">🔒 编辑</button>
  <button class="btn" id="btnExport" data-edit-only>⬇️ 导出 JSON</button>
  <button class="btn primary" id="btnAdd" data-edit-only>➕ 新增角色</button>
  <button class="btn" id="btnImport" data-edit-only>⬆️ 导入 JSON</button>
  <button class="btn danger" id="btnReset" data-edit-only>↺ 恢复默认</button>
  <input type="file" id="fileInput" accept="application/json,.json" style="display:none">
  <input type="file" id="avatarInput" accept="image/*" multiple style="display:none">
</div>

<main>
  <div class="grid" id="grid"></div>
  <footer id="footNote">🌸 每一只都值得被温柔以待 🌸<br>当前是浏览模式</footer>
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <div class="head-left">
        <div class="avatar-sm" id="modalAvatar">🐾</div>
        <h2 id="modalTitle">资料详情</h2>
      </div>
      <button class="btn" id="btnClose" style="padding:6px 14px;">✕</button>
    </div>
    <div class="modal-body">

      <div class="sec-title">基本信息</div>
      <div class="grid2">
        <div class="field">
          <label>名字</label>
          <input type="text" id="f_name" placeholder="例如：团团">
        </div>
        <div class="field">
          <label>自称 <span class="tip">（它怎么称呼自己）</span></label>
          <input type="text" id="f_selfName" placeholder="例如：本喵 / 团团">
        </div>
        <div class="field">
          <label>性别</label>
          <input type="text" id="f_gender" list="genderList" placeholder="男宝宝 / 女宝宝">
          <datalist id="genderList">
            <option value="男宝宝"></option>
            <option value="女宝宝"></option>
            <option value="男孩子"></option>
            <option value="女孩子"></option>
            <option value="未知"></option>
          </datalist>
        </div>
        <div class="field">
          <label>物种</label>
          <input type="text" id="f_species" placeholder="例如：矮脚小奶猫">
        </div>
      </div>

      <div class="sec-title">头像与配色</div>
      <div class="grid2">
        <div class="field">
          <label>代表表情 <span class="tip">（没有专属画像时用 Emoji）</span></label>
          <input type="text" id="f_emoji" placeholder="🐱">
        </div>
        <div class="field">
          <label>卡片配色</label>
          <div class="swatches" id="swatches"></div>
        </div>
      </div>

      <div class="sec-title">性格特征</div>
      <div class="field">
        <label>一行一个标签</label>
        <textarea id="f_personality" placeholder="软萌胆小&#10;敏感爱哭&#10;嘴硬逞强"></textarea>
      </div>

      <div class="sec-title">口头禅与叫声</div>
      <div class="grid2">
        <div class="field">
          <label>口头禅</label>
          <input type="text" id="f_catchphrase" placeholder="咪咬你啦！">
        </div>
        <div class="field">
          <label>叫声</label>
          <input type="text" id="f_sound" placeholder="喵~ / 汪！ / 吱！">
        </div>
      </div>
      <div class="field">
        <label>专属 Emoji / 招牌表情</label>
        <input type="text" id="f_emojiSet" placeholder="🐱🍑📦✨💭">
      </div>

      <div class="sec-title">喜恶</div>
      <div class="grid2">
        <div class="field">
          <label>❤️ 喜欢（一行一个）</label>
          <textarea id="f_likes" placeholder="橘子&#10;躲在角落缩成团"></textarea>
        </div>
        <div class="field">
          <label>💢 讨厌（一行一个）</label>
          <textarea id="f_dislikes" placeholder="洗澡&#10;大声喧哗"></textarea>
        </div>
      </div>

      <div class="sec-title">特殊行为</div>
      <div class="field">
        <label>一行一个小动作 / 小习惯</label>
        <textarea id="f_behaviors" placeholder="害怕时缩成一个球&#10;被摸头会呼噜"></textarea>
      </div>

      <div class="sec-title">外观形象</div>
      <div class="field">
        <label>毛色、体型、五官等描述</label>
        <textarea id="f_appearance" placeholder="奶油色短毛，圆脸大眼，四条小短腿"></textarea>
      </div>

      <div class="sec-title">专属配饰</div>
      <div class="field">
        <label>项圈、发夹、小衣服等</label>
        <textarea id="f_accessories" placeholder="虎纹小帽子（上面有个「王」字）"></textarea>
      </div>

      <div class="sec-title">📷 图像库</div>
      <div class="grid2">
        <div class="field">
          <label>图片目录名 <span class="tip">（仓库里的文件夹）</span></label>
          <input type="text" id="f_slug" placeholder="tuantuan">
        </div>
        <div class="field" style="display:flex;align-items:flex-end;">
          <p class="g-hint" style="margin:0 0 10px;">照片放 <code>images/<b id="slugHint">—</b>/</code></p>
        </div>
      </div>
      <div class="field">
        <div class="gallery-grid" id="galleryGrid"></div>
        <div class="g-add" data-edit-only>
          <input type="text" id="gInput" placeholder="粘贴图片路径或网址后回车，如 images/团团/01.jpg">
          <button class="btn primary" id="btnAddImg" type="button">添加</button>
        </div>
        <p class="g-hint">
          💡 最省事的做法：把照片丢进仓库的 <code>images/&lt;目录名&gt;/</code> 里推上去，GitHub Action 会自动生成清单，刷新页面就能看到 —— 不用在这里手动添加。
        </p>
      </div>

    </div>
    <div class="modal-foot">
      <button class="btn danger" id="btnDelete" data-edit-only>🗑 删除这只</button>
      <div style="display:flex;gap:10px;">
        <button class="btn" id="btnCancel">关闭</button>
        <button class="btn primary" id="btnSave" data-edit-only>💾 保存</button>
      </div>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <span class="lb-close" id="lbClose">✕</span>
  <img id="lightboxImg" alt="">
  <div class="lb-actions">
    <button class="lb-btn" id="lbSetAvatar" type="button">🌟 设为头像</button>
    <button class="lb-btn" id="lbRemove" type="button" style="display:none">🗑 删除这张</button>
  </div>
</div>

<div class="overlay" id="gate">
  <div class="modal" style="max-width:380px;">
    <div class="modal-head">
      <h2>🔒 输入编辑密钥</h2>
      <button class="btn" id="gateClose" style="padding:6px 14px;">✕</button>
    </div>
    <div class="modal-body">
      <div class="gate-box">

/* 统一补齐字段 */
function normalize(c){
  if(!c.slug) c.slug = c.id || '';
  if(!Array.isArray(c.gallery)) c.gallery = [];
  return c;
}
DEFAULTS.forEach(normalize);

/* ============ 存储 ============ */
const STORE_KEY = 'moe_characters_v1';
const clone = o => JSON.parse(JSON.stringify(o));

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return clone(DEFAULTS);
    const data = JSON.parse(raw);
    if(!Array.isArray(data) || data.length === 0) return clone(DEFAULTS);
    return data.map(normalize);
  }catch(e){
    console.warn('读取本地数据失败，回退默认值', e);
    return clone(DEFAULTS);
  }
}
function save(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(chars));
    return true;
  }catch(e){
    toast('保存失败：浏览器存储空间不足或被禁用');
    return false;
  }
}

let chars = load();
let editingId = null;
let pendingAccent = 'peach';
let repoImages = {};   // { 目录名: [图片路径...] }，来自 images/manifest.json
const localUrls = {};  // IndexedDB 里的图片 -> objectURL

/* ============ 本地图片仓库（IndexedDB） ============ */
const DB_NAME = 'moe_pets_images';
const DB_STORE = 'images';
const LOCAL = 'local:';
let _db = null;

function openDB(){
  return new Promise((resolve, reject) => {
    if(_db) return resolve(_db);
    let req;
    try{ req = indexedDB.open(DB_NAME, 1); }
    catch(e){ return reject(e); }
    req.onupgradeneeded = () => {
      if(!req.result.objectStoreNames.contains(DB_STORE)) req.result.createObjectStore(DB_STORE);
    };
    req.onsuccess = () => { _db = req.result; resolve(_db); };
    req.onerror = () => reject(req.error);
  });
}
function idbPut(key, val){
  return openDB().then(db => new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(val, key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  }));
}
function idbGet(key){
  return openDB().then(db => new Promise((res, rej) => {
    const req = db.transaction(DB_STORE, 'readonly').objectStore(DB_STORE).get(key);
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  }));
}
function idbDelete(key){
  return openDB().then(db => new Promise((res, rej) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).delete(key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  }));
}
function idbKeys(){
  return openDB().then(db => new Promise((res, rej) => {
    const req = db.transaction(DB_STORE, 'readonly').objectStore(DB_STORE).getAllKeys();
    req.onsuccess = () => res(req.result || []);
    req.onerror = () => rej(req.error);
  }));
}
async function loadLocalImages(){
  try{
    const keys = await idbKeys();
    for(const k of keys){
      const blob = await idbGet(k);
      if(blob) localUrls[k] = URL.createObjectURL(blob);
    }
    render();
  }catch(e){
    console.warn('本地图片加载失败', e);
  }
}

/* local:key -> 可显示的 URL */
function resolveSrc(src){
  const s = String(src || '');
  if(s.indexOf(LOCAL) === 0) return localUrls[s.slice(LOCAL.length)] || '';
  return s;
}

/* ============ 工具 ============ */
const $ = id => document.getElementById(id);
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function lines(s){
  return String(s || '').split('\n').map(x => x.trim()).filter(Boolean);
}
function val(v, ph){ return v ? esc(v) : `<span class="empty">${ph}</span>`; }
function listHtml(s, ph){
  const arr = lines(s);
  if(!arr.length) return `<span class="empty">${ph}</span>`;
  return `<ul class="list">${arr.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
}
function tagsHtml(s){
  const arr = lines(s);
  if(!arr.length) return '';
  return `<div class="tags">${arr.map(x => `<span class="tag">${esc(x)}</span>`).join('')}</div>`;
}
/* 某只角色的全部照片：仓库目录里的（自动）+ 手动添加的 */
function galleryOf(c){
  const repo = (repoImages[c.slug] || []).map(src => ({src, repo:true}));
  const manual = (c.gallery || []).map(src => ({src, repo:false}));
  return repo.concat(manual);
}

/* 首页卡片上的缩略图条（没有照片就不显示，不留占位） */
function thumbsHtml(c){
  const items = galleryOf(c);
  if(!items.length) return '';
  const show = items.slice(0, 4);
  const rest = items.length - show.length;
  return `<div class="thumbs">${show.map(it =>
    `<img class="thumb" src="${esc(resolveSrc(it.src))}" alt="" data-lb="${esc(it.src)}"
          data-lbchar="${esc(c.id)}" data-lbdel="0"
          onerror="this.style.display='none'">`).join('')
  }${rest > 0 ? `<div class="thumb more" data-more="${esc(c.id)}">+${rest}</div>` : ''}</div>`;
}

/* 头像内容：优先自定义头像图，其次手绘 SVG，最后 Emoji */
function avatarInner(c, opts){
  opts = opts || {};
  let inner;
  if(c.avatarSrc && resolveSrc(c.avatarSrc)){
    inner = `<img src="${esc(resolveSrc(c.avatarSrc))}" alt="">`;
  }else if(c.svg && SVG[c.svg]){
    inner = SVG[c.svg];
  }else{
    inner = esc(c.emoji || '🐾');
  }
  let btns = '';
  if(opts.cam){
    btns += `<button class="cam" type="button" data-cam="${esc(c.id)}" title="上传照片">📷</button>`;
  }
  if(opts.clear && c.avatarSrc){
    btns += `<button class="cam clear" type="button" data-clearia="${esc(c.id)}" title="用回 Emoji 头像">✕</button>`;
  }
  return inner + btns;
}

let toastTimer;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

/* ============ 渲染 ============ */
function render(){
  const q = ($('search').value || '').trim().toLowerCase();
  const grid = $('grid');
  const list = chars.filter(c => {
    if(!q) return true;
    return [c.name, c.selfName, c.gender, c.species, c.personality, c.catchphrase, c.likes, c.behaviors]
      .map(x => String(x || '').toLowerCase()).join(' ').includes(q);
  });

  if(!list.length){
    grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:#BDAE9F;padding:40px 0;">没有找到匹配的小家伙 🥺</div>`;
    return;
  }

  grid.innerHTML = list.map(c => {
    const avatar = avatarInner(c, {cam:canEdit});
    const sub = [c.species, c.gender].filter(Boolean).join(' · ') || '物种未填';
    const lk = lines(c.likes);
    const likeTxt = lk.length ? lk.slice(0, 3).join('、') + (lk.length > 3 ? ' …' : '') : '';
    return `
    <div class="card" style="background:${accentCss(c.accent)}" data-id="${esc(c.id)}">
      <button class="edit-hint" data-edit="${esc(c.id)}">${canEdit ? '详情 ✏️' : '详情'}</button>
      <div class="avatar" data-edit="${esc(c.id)}">${avatar}</div>
      <h3 class="char-name">${esc(c.name || '未命名')}</h3>
      <p class="char-sub">${esc(sub)}</p>
      ${c.selfName ? `<p class="char-self">自称「${esc(c.selfName)}」</p>` : ''}
      ${tagsHtml(c.personality)}
      ${thumbsHtml(c)}
      <div class="panel">
        <div class="row"><span class="k">📢 口头禅</span><span class="v quote">${val(c.catchphrase, '还没说')}</span></div>
        ${c.sound ? `<div class="row"><span class="k">🔊 叫声</span><span class="v">${esc(c.sound)}</span></div>` : ''}
        ${c.emojiSet ? `<div class="row"><span class="k">✨ 专属</span><span class="v">${esc(c.emojiSet)}</span></div>` : ''}
        ${likeTxt ? `<div class="row"><span class="k">❤️ 喜欢</span><span class="v">${esc(likeTxt)}</span></div>` : ''}
      </div>
    </div>`;
  }).join('');

  grid.querySelectorAll('[data-edit]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      openEditor(el.dataset.edit);
    });
  });
  grid.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => openEditor(card.dataset.id));
  });
  grid.querySelectorAll('[data-cam]').forEach(el => {
    el.addEventListener('click', e => { e.stopPropagation(); startUpload(el.dataset.cam); });
  });
  grid.querySelectorAll('[data-lb]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      openLightbox(el.dataset.lb, el.dataset.lbdel === '1', el.dataset.lbchar);
    });
  });
  grid.querySelectorAll('[data-more]').forEach(el => {
    el.addEventListener('click', e => { e.stopPropagation(); openEditor(el.dataset.more); });
  });
}

/* ============ 图像库 ============ */
function renderGallery(){
  const c = chars.find(x => x.id === editingId);
  if(!c) return;
  const dir = c.slug || c.id;
  $('slugHint').textContent = dir;
  const items = galleryOf(c);
  const repoCount = items.filter(i => i.repo).length;

  $('galleryGrid').innerHTML = items.length
    ? items.map(it => `
      <div class="g-item">
        <img src="${esc(resolveSrc(it.src))}" alt=""
             data-lb="${esc(it.src)}" data-lbchar="${esc(c.id)}" data-lbdel="${it.repo ? 0 : 1}"
             onerror="this.style.opacity=.25">
        ${c.avatarSrc === it.src ? '<span class="avatar-now">头像</span>' : ''}
        ${it.repo
          ? '<span class="repo-badge">仓库</span>'
          : (canEdit ? `<button class="g-del" type="button" data-src="${esc(it.src)}" title="移除">✕</button>` : '')}
      </div>`).join('')
    : `<div style="grid-column:1/-1;color:#BDAE9F;font-size:13px;padding:4px 0 2px;">
         还没有照片 🐾 点上面的头像上传，或把图片放进 <b>images/${esc(dir)}/</b> 推送上来。
       </div>`;

  $('galleryGrid').querySelectorAll('[data-lb]').forEach(el => {
    el.addEventListener('click', () => openLightbox(el.dataset.lb, el.dataset.lbdel === '1', el.dataset.lbchar));
  });
  $('galleryGrid').querySelectorAll('[data-src]').forEach(el => {
    el.addEventListener('click', async () => {
      const cur = chars.find(x => x.id === editingId);
      if(cur){ await removeImg(cur, el.dataset.src); toast('已移除'); }
    });
  });
}

let lbSrc = '', lbCharId = null;
function openLightbox(src, removable, charId){
  lbSrc = src;
  lbCharId = charId || editingId;
  $('lightboxImg').src = resolveSrc(src) || src;
  $('lbRemove').style.display = (removable && canEdit) ? '' : 'none';
  $('lbSetAvatar').style.display = canEdit ? '' : 'none';
  $('lightbox').classList.add('open');
}
function closeLightbox(){ $('lightbox').classList.remove('open'); }

/* 删掉一张图（同时清掉 IndexedDB 里的原图和头像引用） */
async function dropLocalBlob(src){
  if(String(src).indexOf(LOCAL) !== 0) return;
  const k = String(src).slice(LOCAL.length);
  try{ await idbDelete(k); }catch(e){}
  if(localUrls[k]){ URL.revokeObjectURL(localUrls[k]); delete localUrls[k]; }
}
async function removeImg(c, src){
  const idx = (c.gallery || []).indexOf(src);
  if(idx < 0) return;
  c.gallery.splice(idx, 1);
  await dropLocalBlob(src);
  if(c.avatarSrc === src) c.avatarSrc = '';
  save();
  if(editingId === c.id) renderGallery();
  render();
}

/* 从头像上传照片 */
let uploadTargetId = null;
function startUpload(id){
  if(!canEdit) return;
  uploadTargetId = id;
  $('avatarInput').value = '';
  $('avatarInput').click();
}
async function handleUpload(files){
  if(!canEdit) return;
  const c = chars.find(x => x.id === uploadTargetId);
  if(!c || !files || !files.length) return;
  const imgs = [...files].filter(f => f.type && f.type.indexOf('image/') === 0);
  if(!imgs.length){ toast('这不是图片文件 🐾'); return; }
  let n = 0;
  for(const f of imgs){
    const key = (c.slug || c.id) + '/' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,6) + '_' + f.name;
    try{
      await idbPut(key, f);
      localUrls[key] = URL.createObjectURL(f);
      c.gallery.push(LOCAL + key);
      if(!c.avatarSrc) c.avatarSrc = LOCAL + key;   // 第一张自动当头像
      n++;
    }catch(e){
      toast('保存失败：' + (e && e.message ? e.message : '未知错误'));
    }
  }
  save();
  if(editingId === c.id) renderGallery();
  render();
  if(n) toast('已上传 ' + n + ' 张 📷');
}

async function loadManifest(){
  try{
    const res = await fetch('images/manifest.json', {cache:'no-store'});
    if(!res.ok) return;
    const data = await res.json();
    if(data && typeof data === 'object'){ repoImages = data; render(); }
  }catch(e){
    /* 本地 file:// 打开或还没有清单文件时忽略 */
  }
}

/* ============ 编辑器 ============ */
const FIELDS = ['name','selfName','gender','species','emoji','personality',
                'catchphrase','sound','emojiSet','likes','dislikes',
                'behaviors','appearance','accessories','slug'];

function buildSwatches(){
  $('swatches').innerHTML = ACCENTS.map(a =>
    `<div class="swatch${a.id === pendingAccent ? ' sel' : ''}" data-accent="${a.id}"
          style="background:${a.css}" title="${a.id}"></div>`).join('');
  $('swatches').querySelectorAll('.swatch').forEach(sw => {
    sw.addEventListener('click', () => {
      pendingAccent = sw.dataset.accent;
      $('swatches').querySelectorAll('.swatch').forEach(x => x.classList.remove('sel'));
      sw.classList.add('sel');
    });
  });
}

function openEditor(id){
  const c = chars.find(x => x.id === id);
  if(!c) return;
  editingId = id;
  $('modalTitle').textContent = c.name || '未命名';
  $('modalAvatar').innerHTML = avatarInner(c, {cam:canEdit, clear:canEdit});
  FIELDS.forEach(f => { const el = $('f_' + f); if(el) el.value = c[f] || ''; });
  pendingAccent = c.accent || 'peach';
  buildSwatches();
  renderGallery();
  applyReadonly();
  $('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  setTimeout(() => $('f_name').focus(), 60);
}
function closeEditor(){
  $('overlay').classList.remove('open');
  document.body.style.overflow = '';
  editingId = null;
}
function saveEditor(){
  if(!canEdit) return;
  const c = chars.find(x => x.id === editingId);
  if(!c) return;
  FIELDS.forEach(f => { const el = $('f_' + f); if(el) c[f] = el.value.trim(); });
  c.accent = pendingAccent;
  if(save()) toast('已保存 🐾');
  render();
  closeEditor();
}

/* ============ 编辑权限（默认只读，密钥解锁） ============ */
const EDIT_FLAG = 'moe_edit_token_v1';
let canEdit = false;

function cfg(){ return window.MOE_EDIT || {}; }

async function sha256(str){
  const buf = new TextEncoder().encode(String(str));
  const d = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(d)).map(b => b.toString(16).padStart(2, '0')).join('');
}

/* 用户输入 -> 与配置里的哈希比对 */
async function checkKey(input){
  const c = cfg();
  if(!c.hash || !input) return false;
  try{
    return (await sha256(String(c.salt || '') + input)) === c.hash;
  }catch(e){
    return false;
  }
}

/* 让弹窗里的输入控件随权限切换可写 / 只读 */
function applyReadonly(){
  document.querySelectorAll('#overlay .modal-body input, #overlay .modal-body textarea').forEach(el => {
    el.readOnly = !canEdit;
  });
}

function setEdit(on, silent){
  canEdit = on;
  document.body.classList.toggle('ro', !on);

  const g = $('btnGate');
  g.textContent = on ? '🔓 编辑中 · 锁定' : '🔒 编辑';
  g.classList.toggle('primary', !on);

  $('heroSub').textContent = on
    ? '点开任意一只 → 编辑资料 · 改动保存在本机浏览器，刷新不丢失'
    : '点开任意一只 → 查看完整资料';
  $('footNote').innerHTML = on
    ? '🌸 每一只都值得被温柔以待 🌸<br>编辑模式 · 改动只存在这台设备的浏览器里'
    : '🌸 每一只都值得被温柔以待 🌸<br>当前是浏览模式';

  applyReadonly();
  render();
  if(!silent && on) toast('已进入编辑模式 🔓');
}

async function unlockWith(input){
  if(await checkKey(input)){
    try{ localStorage.setItem(EDIT_FLAG, cfg().hash); }catch(e){}
    $('gate').classList.remove('open');
    $('gateErr').textContent = '';
    setEdit(true);
    return true;
  }
  return false;
}

/* ============ 事件 ============ */
$('btnAdd').addEventListener('click', () => {
  if(!canEdit) return;
  const c = {
    id: 'c_' + Date.now().toString(36),
    name:'新角色', selfName:'', gender:'', species:'',
    emoji:'🐾', accent: ACCENTS[chars.length % ACCENTS.length].id, svg:'',
    slug:'', gallery:[],
    personality:'', catchphrase:'', sound:'', emojiSet:'',
    likes:'', dislikes:'', behaviors:'', appearance:'', accessories:''
  };
  c.slug = c.id;
  chars.push(c);
  save();
  render();
  openEditor(c.id);
});

$('btnDelete').addEventListener('click', () => {
  if(!canEdit) return;
  const c = chars.find(x => x.id === editingId);
  if(!c) return;
  if(!confirm(`确定要删除「${c.name || '未命名'}」吗？此操作不可撤销。`)) return;
  chars = chars.filter(x => x.id !== editingId);
  save();
  render();
  closeEditor();
  toast('已删除');
});

$('btnSave').addEventListener('click', saveEditor);
$('btnCancel').addEventListener('click', closeEditor);
$('btnClose').addEventListener('click', closeEditor);
$('overlay').addEventListener('click', e => { if(e.target === $('overlay')) closeEditor(); });
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    if($('lightbox').classList.contains('open')) closeLightbox();
    else if($('gate').classList.contains('open')) $('gate').classList.remove('open');
    else if($('overlay').classList.contains('open')) closeEditor();
  }
  if((e.ctrlKey || e.metaKey) && e.key === 's' && $('overlay').classList.contains('open')){
    e.preventDefault(); saveEditor();
  }
  if(e.key === 'Enter' && $('gate').classList.contains('open')){
    e.preventDefault(); submitGate();
  }
});

// 图像库：添加 / 放大 / 目录名提示
function addImg(){
  if(!canEdit) return;
  const v = $('gInput').value.trim();
  if(!v) return;
  const c = chars.find(x => x.id === editingId);
  if(!c) return;
  c.gallery.push(v);
  $('gInput').value = '';
  save(); renderGallery(); render();
  toast('已添加 🖼');
}
$('btnAddImg').addEventListener('click', addImg);
$('gInput').addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); addImg(); }
});
$('lightbox').addEventListener('click', closeLightbox);
$('lbClose').addEventListener('click', closeLightbox);
$('f_slug').addEventListener('input', e => {
  $('slugHint').textContent = e.target.value || '—';
});

// 头像上传
$('avatarInput').addEventListener('change', e => {
  if(canEdit) handleUpload(e.target.files);
  e.target.value = '';
});
$('modalAvatar').addEventListener('click', e => {
  if(!canEdit) return;
  const clearBtn = e.target.closest('[data-clearia]');
  if(clearBtn){
    const c = chars.find(x => x.id === clearBtn.dataset.clearia);
    if(c){
      c.avatarSrc = '';
      save(); renderGallery(); render();
      $('modalAvatar').innerHTML = avatarInner(c, {cam:true, clear:true});
      toast('已用回 Emoji 头像');
    }
    return;
  }
  if(editingId) startUpload(editingId);
});

// 大图：设为头像 / 删除
$('lbSetAvatar').addEventListener('click', e => {
  e.stopPropagation();
  if(!canEdit) return;
  const c = chars.find(x => x.id === lbCharId);
  if(!c) return;
  c.avatarSrc = lbSrc;
  save();
  render();
  if(editingId === c.id){
    renderGallery();
    $('modalAvatar').innerHTML = avatarInner(c, {cam:true, clear:true});
  }
  closeLightbox();
  toast('头像已更新 🌟');
});
$('lbRemove').addEventListener('click', async e => {
  e.stopPropagation();
  if(!canEdit) return;
  const c = chars.find(x => x.id === lbCharId);
  if(!c) return;
  await removeImg(c, lbSrc);
  if(editingId === c.id) $('modalAvatar').innerHTML = avatarInner(c, {cam:true, clear:true});
  closeLightbox();
  toast('已删除');
});

$('search').addEventListener('input', render);

// 输入时实时预览标题与头像
$('f_name').addEventListener('input', e => { $('modalTitle').textContent = e.target.value || '未命名'; });
$('f_emoji').addEventListener('input', e => { $('modalAvatar').textContent = e.target.value || '🐾'; });

$('btnExport').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(chars, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'moe_characters.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('已导出 JSON');
});

$('btnImport').addEventListener('click', () => { if(canEdit) $('fileInput').click(); });
$('fileInput').addEventListener('change', e => {
  if(!canEdit){ e.target.value = ''; return; }
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!Array.isArray(data)) throw new Error('格式不是数组');
      if(!confirm(`即将导入 ${data.length} 只角色，会覆盖当前全部数据，继续吗？`)) return;
      chars = data.map(c => normalize(Object.assign({id:'c_'+Math.random().toString(36).slice(2,8)}, c)));
      save(); render(); toast('导入成功');
    }catch(err){
      alert('导入失败：' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

$('btnReset').addEventListener('click', () => {
  if(!canEdit) return;
  if(!confirm('恢复为初始的六只小家伙？你现在的修改会被覆盖。')) return;
  chars = clone(DEFAULTS);
  save(); render(); toast('已恢复默认');
});

/* ---- 解锁 / 锁定 ---- */
$('btnGate').addEventListener('click', () => {
  if(canEdit){
    try{ localStorage.removeItem(EDIT_FLAG); }catch(e){}
    setEdit(false);
    toast('已锁定 🔒');
  }else{
    $('gateInput').value = '';
    $('gateErr').textContent = '';
    $('gate').classList.add('open');
    setTimeout(() => $('gateInput').focus(), 60);
  }
});
$('gateClose').addEventListener('click', () => $('gate').classList.remove('open'));
$('gateCancel').addEventListener('click', () => $('gate').classList.remove('open'));
$('gate').addEventListener('click', e => { if(e.target === $('gate')) $('gate').classList.remove('open'); });
$('gateOk').addEventListener('click', submitGate);

async function submitGate(){
  const v = $('gateInput').value.trim();
  if(!v) return;
  if(await unlockWith(v)) return;
  $('gateErr').textContent = '密钥不对 🐾';
  $('gateInput').select();
}

/* ---- 启动 ---- */
setEdit(false, true);
loadManifest();
loadLocalImages();

/* 用 ?edit=密钥 打开一次即解锁，之后本机直接打开都是编辑模式 */
(async function init(){
  const key = new URLSearchParams(location.search).get('edit');
  if(key){
    if(await unlockWith(key)){
      try{ history.replaceState(null, '', location.pathname + location.hash); }catch(e){}
      return;
    }
    toast('密钥不对 🐾');
    return;
  }
  try{
    if(localStorage.getItem(EDIT_FLAG) && localStorage.getItem(EDIT_FLAG) === cfg().hash){
      setEdit(true, true);
    }
  }catch(e){}
})();
</script>
